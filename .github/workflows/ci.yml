name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: link an exported CSV
        run: |
          go run ./cmd/chartlink export -people 1000 > records.csv
          go run ./cmd/chartlink link < records.csv > charts.csv
          test "$(wc -l < charts.csv)" -eq "$(wc -l < records.csv)"
